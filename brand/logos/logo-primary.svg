<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="50%" style="stop-color:#651FFF"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="#1A1A2E"/>

  <!-- Outer hub ring -->
  <circle cx="256" cy="200" r="100" stroke="url(#hubGrad)" stroke-width="12" fill="none" filter="url(#softGlow)"/>
  <circle cx="256" cy="200" r="100" stroke="url(#hubGrad)" stroke-width="6" fill="none" opacity="0.4"/>

  <!-- Center play triangle -->
  <polygon points="232,160 232,240 296,200" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Connection nodes around the ring -->
  <circle cx="256" cy="100" r="12" fill="#00E5FF"/>
  <circle cx="256" cy="300" r="12" fill="#7C4DFF"/>
  <circle cx="176" cy="140" r="12" fill="#7C4DFF"/>
  <circle cx="336" cy="140" r="12" fill="#00E5FF"/>
  <circle cx="176" cy="260" r="12" fill="#00E5FF"/>
  <circle cx="336" cy="260" r="12" fill="#7C4DFF"/>

  <!-- Connection lines -->
  <line x1="256" y1="112" x2="256" y2="160" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="240" x2="256" y2="288" stroke="#7C4DFF" stroke-width="2" opacity="0.4"/>
  <line x1="184" y1="148" x2="228" y2="172" stroke="#7C4DFF" stroke-width="2" opacity="0.4"/>
  <line x1="328" y1="148" x2="284" y2="172" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>

  <!-- Bottom media tiles (3 grid) -->
  <rect x="86" y="350" width="100" height="70" rx="12" fill="#16213E" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>
  <rect x="206" y="350" width="100" height="70" rx="12" fill="#16213E" stroke="#7C4DFF" stroke-width="2" opacity="0.8"/>
  <rect x="326" y="350" width="100" height="70" rx="12" fill="#16213E" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>

  <!-- Mini play icons in tiles -->
  <polygon points="121,375 121,395 141,385" fill="#00E5FF" opacity="0.6"/>
  <polygon points="241,375 241,395 261,385" fill="#7C4DFF" opacity="0.6"/>
  <polygon points="361,375 361,395 381,385" fill="#00E5FF" opacity="0.6"/>
</svg>